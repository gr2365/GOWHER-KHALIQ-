<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Galaxy Guardian | Gowher Khaliq</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: Inter, system-ui, sans-serif; background: #020617; color: white; }
    canvas { display: block; width: 100vw; height: 100vh; }
    .hud { position: fixed; inset: 16px 18px auto; display: flex; justify-content: space-between; pointer-events: none; font-weight: 800; text-shadow: 0 2px 12px #000; }
    .hud div { padding: 8px 12px; border: 1px solid #94a3b855; border-radius: 999px; background: #0f172acc; }
    .panel { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at center, #182a65cc, #020617ee); }
    .card { width: min(560px, 92vw); padding: 32px; text-align: center; border: 1px solid #89aaff55; border-radius: 24px; background: linear-gradient(145deg, #111c44dd, #090e25ee); box-shadow: 0 20px 80px #000; }
    .card h1 { margin: 0 0 8px; font-size: clamp(36px, 8vw, 68px); background: linear-gradient(135deg, #67e8f9, #a78bfa, #f472b6); background-clip: text; color: transparent; }
    .card p { color: #b7c5e7; }
    .card button { border: 0; border-radius: 999px; padding: 14px 28px; font-weight: 900; font-size: 16px; color: #07112c; background: linear-gradient(135deg, #67e8f9, #c4b5fd); cursor: pointer; }
    .back { position: fixed; right: 18px; bottom: 84px; z-index: 3; color: #cbd5e1; text-decoration: none; background: #0f172acc; border: 1px solid #64748b; padding: 10px 14px; border-radius: 999px; }
    .pause { position: fixed; right: 18px; top: 66px; z-index: 3; border: 1px solid #64748b; border-radius: 999px; background: #0f172acc; color: white; padding: 10px 14px; }
    .controls { position: fixed; left: 18px; bottom: 84px; display: flex; gap: 10px; }
    .controls button { width: 72px; height: 72px; border: 1px solid #94a3b855; border-radius: 18px; background: #0f172acc; color: white; font-size: 14px; font-weight: 900; touch-action: none; user-select: none; box-shadow: 0 8px 28px #020617; }
    .hidden { display: none; }
    @media (min-width: 700px) { .controls { display: none; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div id="score">SCORE 0</div>
    <div id="level">LEVEL 1</div>
    <div id="lives">SHIELDS 3</div>
  </div>
  <button class="pause" id="pause" type="button">Pause</button>
  <div id="menu" class="panel">
    <div class="card">
      <h1>Galaxy Guardian</h1>
      <p>Protect the planet through five cosmic sectors. Move with arrow keys or A/D and fire with Space.</p>
      <button id="start" type="button">Launch Mission</button>
      <p id="best">Best score: 0</p>
    </div>
  </div>
  <a class="back" href="/">Back Home</a>
  <div class="controls">
    <button id="left" type="button" aria-label="Move left">Left</button>
    <button id="fire" type="button" aria-label="Fire">Fire</button>
    <button id="right" type="button" aria-label="Move right">Right</button>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    let width, height, dpr, running = false, paused = false, last = 0, spawnTimer = 0, powerTimer = 0;
    let score = 0, lives = 3, level = 1, combo = 1, comboTimer = 0, rapidFire = 0, shield = 0;
    let bullets = [], enemies = [], powerups = [], particles = [], stars = [];
    const keys = {};
    const ship = { x: 0, y: 0, r: 18, speed: 430 };
    let best = Number(localStorage.getItem("galaxyGuardianBest") || 0);
    document.getElementById("best").textContent = "Best score: " + best;

    function resize() {
      dpr = Math.min(devicePixelRatio || 1, 2);
      width = innerWidth;
      height = innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ship.x = width / 2;
      ship.y = height - 75;
      stars = Array.from({ length: Math.floor(width * height / 8000) }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 45 + 15
      }));
    }

    function reset() {
      bullets = []; enemies = []; powerups = []; particles = [];
      score = 0; lives = 3; level = 1; combo = 1; rapidFire = 0; shield = 0;
      ship.x = width / 2;
      running = true;
      paused = false;
      spawnTimer = 0;
      powerTimer = 8;
      document.getElementById("menu").classList.add("hidden");
      document.getElementById("pause").textContent = "Pause";
      updateHud();
    }

    function updateHud() {
      document.getElementById("score").textContent = "SCORE " + score;
      document.getElementById("level").textContent = "LEVEL " + level;
      document.getElementById("lives").textContent = "SHIELDS " + lives;
    }

    function burst(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 190 + 50;
        particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 1, color });
      }
    }

    function shoot() {
      if (!running || paused) return;
      if (rapidFire > 0) {
        bullets.push({ x: ship.x - 8, y: ship.y - 24, vx: -90, vy: -700 });
        bullets.push({ x: ship.x + 8, y: ship.y - 24, vx: 90, vy: -700 });
      } else {
        bullets.push({ x: ship.x, y: ship.y - 24, vx: 0, vy: -620 });
      }
    }

    function end() {
      running = false;
      if (score > best) {
        best = score;
        localStorage.setItem("galaxyGuardianBest", String(best));
      }
      document.querySelector("#menu h1").textContent = "Mission Complete";
      document.querySelector("#menu p").textContent = "Score " + score + " | Best " + best;
      document.getElementById("best").textContent = "Best score: " + best;
      document.getElementById("start").textContent = "Fly Again";
      document.getElementById("menu").classList.remove("hidden");
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      document.getElementById("pause").textContent = paused ? "Resume" : "Pause";
    }

    addEventListener("resize", resize);
    resize();
    document.getElementById("start").addEventListener("click", reset);
    document.getElementById("pause").addEventListener("click", togglePause);
    addEventListener("keydown", event => {
      keys[event.key.toLowerCase()] = true;
      if (event.code === "Space") { event.preventDefault(); shoot(); }
      if (event.key.toLowerCase() === "p") togglePause();
    });
    addEventListener("keyup", event => keys[event.key.toLowerCase()] = false);

    function bindTouch(id, onDown, onUp) {
      const button = document.getElementById(id);
      button.addEventListener("pointerdown", event => { event.preventDefault(); onDown(); });
      button.addEventListener("pointerup", () => onUp && onUp());
      button.addEventListener("pointercancel", () => onUp && onUp());
    }
    bindTouch("left", () => keys.a = true, () => keys.a = false);
    bindTouch("right", () => keys.d = true, () => keys.d = false);
    bindTouch("fire", shoot);

    function update(dt) {
      for (const star of stars) {
        star.y += star.speed * dt;
        if (star.y > height) { star.y = -4; star.x = Math.random() * width; }
      }
      if (!running || paused) return;
      if (keys.arrowleft || keys.a) ship.x -= ship.speed * dt;
      if (keys.arrowright || keys.d) ship.x += ship.speed * dt;
      ship.x = Math.max(25, Math.min(width - 25, ship.x));
      if (comboTimer > 0) comboTimer -= dt; else combo = 1;
      if (rapidFire > 0) rapidFire -= dt;
      if (shield > 0) shield -= dt;
      level = Math.min(5, 1 + Math.floor(score / 250));
      spawnTimer -= dt;
      powerTimer -= dt;
      if (spawnTimer <= 0) {
        const boss = level === 5 && enemies.filter(enemy => enemy.boss).length === 0 && Math.random() < 0.12;
        spawnTimer = Math.max(0.22, 0.78 - level * 0.1);
        enemies.push({
          x: 40 + Math.random() * Math.max(1, width - 80),
          y: -45,
          r: boss ? 42 : 16 + Math.random() * 13,
          hp: boss ? 12 : 1,
          vx: (Math.random() - 0.5) * (25 + level * 8),
          vy: 70 + Math.random() * 55 + level * 18,
          angle: 0,
          boss
        });
      }
      if (powerTimer <= 0) {
        powerTimer = 10 + Math.random() * 8;
        powerups.push({ x: 35 + Math.random() * (width - 70), y: -30, vy: 120, kind: Math.random() < 0.5 ? "rapid" : "shield" });
      }
      for (const bullet of bullets) { bullet.x += bullet.vx * dt; bullet.y += bullet.vy * dt; }
      bullets = bullets.filter(bullet => bullet.y > -30 && bullet.x > -30 && bullet.x < width + 30);
      for (const enemy of enemies) {
        enemy.x += enemy.vx * dt;
        enemy.y += enemy.vy * dt;
        enemy.angle += dt * 2;
        if (enemy.x < enemy.r || enemy.x > width - enemy.r) enemy.vx *= -1;
      }
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        if (enemy.y > height + 50) {
          enemies.splice(i, 1);
          if (shield <= 0) {
            lives--;
            burst(ship.x, height - 50, "#38bdf8", 18);
            if (lives <= 0) end();
          }
          updateHud();
          continue;
        }
        for (let j = bullets.length - 1; j >= 0; j--) {
          const bullet = bullets[j];
          const dx = bullet.x - enemy.x, dy = bullet.y - enemy.y;
          if (dx * dx + dy * dy < (enemy.r + 6) ** 2) {
            bullets.splice(j, 1);
            enemy.hp--;
            burst(bullet.x, bullet.y, enemy.boss ? "#f472b6" : "#c4b5fd", enemy.boss ? 8 : 5);
            if (enemy.hp <= 0) {
              enemies.splice(i, 1);
              combo = comboTimer > 0 ? Math.min(5, combo + 1) : 1;
              comboTimer = 1.8;
              score += (enemy.boss ? 100 : 10) * combo;
              burst(enemy.x, enemy.y, enemy.boss ? "#f472b6" : "#67e8f9", enemy.boss ? 30 : 16);
            }
            updateHud();
            break;
          }
        }
      }
      for (let i = powerups.length - 1; i >= 0; i--) {
        const power = powerups[i];
        power.y += power.vy * dt;
        const dx = power.x - ship.x, dy = power.y - ship.y;
        if (dx * dx + dy * dy < 35 ** 2) {
          if (power.kind === "rapid") rapidFire = 8; else shield = 8;
          burst(power.x, power.y, power.kind === "rapid" ? "#facc15" : "#22d3ee", 20);
          powerups.splice(i, 1);
        } else if (power.y > height + 30) powerups.splice(i, 1);
      }
      for (const particle of particles) {
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vx *= 0.98;
        particle.vy *= 0.98;
        particle.life -= dt * 1.5;
      }
      particles = particles.filter(particle => particle.life > 0);
    }

    function draw() {
      ctx.fillStyle = "#020617";
      ctx.fillRect(0, 0, width, height);
      const glow = ctx.createRadialGradient(width * 0.5, height * 0.85, 0, width * 0.5, height * 0.85, width * 0.7);
      glow.addColorStop(0, "#172554");
      glow.addColorStop(1, "#020617");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);
      ctx.save();
      ctx.translate(width * 0.78, height * 0.18);
      ctx.rotate(-0.32);
      ctx.scale(1.5, 0.55);
      const galaxy = ctx.createRadialGradient(0, 0, 3, 0, 0, 150);
      galaxy.addColorStop(0, "#fffbe8");
      galaxy.addColorStop(0.12, "#dbeafecc");
      galaxy.addColorStop(0.42, "#818cf8aa");
      galaxy.addColorStop(0.75, "#312e8177");
      galaxy.addColorStop(1, "#02061700");
      ctx.fillStyle = galaxy;
      ctx.beginPath();
      ctx.arc(0, 0, 150, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = "#fff";
      for (const star of stars) {
        ctx.globalAlpha = 0.35 + star.size * 0.25;
        ctx.fillRect(star.x, star.y, star.size, star.size);
      }
      ctx.globalAlpha = 1;
      if (running) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        if (shield > 0) {
          ctx.strokeStyle = "#22d3ee";
          ctx.lineWidth = 3;
          ctx.shadowBlur = 24;
          ctx.shadowColor = "#22d3ee";
          ctx.beginPath();
          ctx.arc(0, 0, 31, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.shadowBlur = 25;
        ctx.shadowColor = "#67e8f9";
        ctx.fillStyle = "#67e8f9";
        ctx.beginPath();
        ctx.moveTo(0, -24);
        ctx.lineTo(18, 18);
        ctx.lineTo(0, 10);
        ctx.lineTo(-18, 18);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.shadowBlur = 15;
      ctx.shadowColor = "#67e8f9";
      ctx.fillStyle = "#a5f3fc";
      for (const bullet of bullets) ctx.fillRect(bullet.x - 2, bullet.y - 9, 4, 18);
      ctx.shadowBlur = 0;
      for (const enemy of enemies) {
        ctx.save();
        ctx.translate(enemy.x, enemy.y);
        ctx.rotate(enemy.angle);
        ctx.strokeStyle = enemy.boss ? "#facc15" : "#f472b6";
        ctx.lineWidth = enemy.boss ? 5 : 3;
        ctx.shadowBlur = 18;
        ctx.shadowColor = ctx.strokeStyle;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const angle = i * Math.PI / 4;
          const radius = i % 2 ? enemy.r * 0.62 : enemy.r;
          const x = Math.cos(angle) * radius, y = Math.sin(angle) * radius;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
      for (const power of powerups) {
        ctx.fillStyle = power.kind === "rapid" ? "#facc15" : "#22d3ee";
        ctx.shadowBlur = 20;
        ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath();
        ctx.arc(power.x, power.y, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#020617";
        ctx.font = "bold 13px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(power.kind === "rapid" ? "R" : "S", power.x, power.y + 4);
        ctx.shadowBlur = 0;
      }
      for (const particle of particles) {
        ctx.globalAlpha = Math.max(particle.life, 0);
        ctx.fillStyle = particle.color;
        ctx.fillRect(particle.x, particle.y, 3, 3);
      }
      ctx.globalAlpha = 1;
      if (paused) {
        ctx.fillStyle = "#020617bb";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "white";
        ctx.font = "bold 42px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("PAUSED", width / 2, height / 2);
      }
    }

    function loop(time) {
      const dt = Math.min((time - last) / 1000, 0.035) || 0;
      last = time;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
