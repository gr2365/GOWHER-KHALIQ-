<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Galaxy Guardian | Gowher Khaliq</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:Inter,system-ui,sans-serif;background:#020617;color:white}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;inset:18px 18px auto;display:flex;justify-content:space-between;pointer-events:none;font-weight:800;text-shadow:0 2px 12px #000}.panel{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at center,#182a65cc,#020617ee)}.card{width:min(520px,92vw);padding:32px;text-align:center;border:1px solid #89aaff55;border-radius:24px;background:linear-gradient(145deg,#111c44dd,#090e25ee);box-shadow:0 20px 80px #000}.card h1{margin:0 0 8px;font-size:clamp(36px,8vw,68px);background:linear-gradient(135deg,#67e8f9,#a78bfa,#f472b6);background-clip:text;color:transparent}.card p{color:#b7c5e7}.card button{border:0;border-radius:999px;padding:14px 28px;font-weight:900;font-size:16px;color:#07112c;background:linear-gradient(135deg,#67e8f9,#c4b5fd);cursor:pointer}.back{position:fixed;right:18px;bottom:18px;z-index:3;color:#cbd5e1;text-decoration:none;background:#0f172acc;border:1px solid #64748b;padding:10px 14px;border-radius:999px}.controls{position:fixed;left:18px;bottom:18px;display:flex;gap:8px}.controls button{width:58px;height:58px;border:1px solid #94a3b855;border-radius:18px;background:#0f172acc;color:white;font-size:22px;touch-action:none}@media(min-width:700px){.controls{display:none}}.hidden{display:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><div id="score">SCORE 0</div><div id="lives">SHIELDS 3</div></div>
<div id="menu" class="panel"><div class="card"><h1>Galaxy Guardian</h1><p>Protect the planet. Move with arrow keys, A/D, or touch controls.</p><button id="start">Launch Mission</button></div></div>
<a class="back" href="/">← Home</a>
<div class="controls"><button id="left" aria-label="Move left">←</button><button id="fire" aria-label="Fire">●</button><button id="right" aria-label="Move right">→</button></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let w,h,dpr,stars=[],bullets=[],enemies=[],particles=[],running=false,keys={},score=0,lives=3,last=0,spawn=0;
const ship={x:0,y:0,r:18,speed:430};
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ship.x=w/2;ship.y=h-75;stars=Array.from({length:Math.floor(w*h/9000)},()=>({x:Math.random()*w,y:Math.random()*h,s:Math.random()*2+.4,v:Math.random()*35+15}))}addEventListener('resize',resize);resize();
function reset(){bullets=[];enemies=[];particles=[];score=0;lives=3;ship.x=w/2;running=true;document.getElementById('menu').classList.add('hidden');document.getElementById('score').textContent='SCORE 0';document.getElementById('lives').textContent='SHIELDS 3'}
function shoot(){if(running)bullets.push({x:ship.x,y:ship.y-24,v:-620})}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();shoot()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.getElementById('start').onclick=reset;
function touch(id,on){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();on(true)});el.addEventListener('pointerup',()=>on(false));el.addEventListener('pointercancel',()=>on(false))}touch('left',v=>keys.a=v);touch('right',v=>keys.d=v);touch('fire',v=>{if(v)shoot()});
function burst(x,y,color,n=12){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*180+60;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color})}}
function end(){running=false;document.querySelector('#menu h1').textContent='Mission Complete';document.querySelector('#menu p').textContent='Final score: '+score+' — Ready for another flight?';document.getElementById('start').textContent='Fly Again';document.getElementById('menu').classList.remove('hidden')}
function update(dt){for(const s of stars){s.y+=s.v*dt;if(s.y>h){s.y=-4;s.x=Math.random()*w}}if(!running)return;if(keys.arrowleft||keys.a)ship.x-=ship.speed*dt;if(keys.arrowright||keys.d)ship.x+=ship.speed*dt;ship.x=Math.max(25,Math.min(w-25,ship.x));for(const b of bullets)b.y+=b.v*dt;bullets=bullets.filter(b=>b.y>-30);spawn-=dt;if(spawn<=0){spawn=Math.max(.28,.85-score/1800);enemies.push({x:30+Math.random()*Math.max(1,w-60),y:-35,r:16+Math.random()*14,v:75+Math.random()*75+score*.12,angle:0})}for(const e of enemies){e.y+=e.v*dt;e.angle+=dt*2}for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.y>h+40){enemies.splice(i,1);lives--;document.getElementById('lives').textContent='SHIELDS '+lives;burst(ship.x,h-50,'#38bdf8',18);if(lives<=0)end()}for(let j=bullets.length-1;j>=0;j--){const b=bullets[j],dx=b.x-e.x,dy=b.y-e.y;if(dx*dx+dy*dy<(e.r+6)**2){bullets.splice(j,1);enemies.splice(i,1);score+=10;document.getElementById('score').textContent='SCORE '+score;burst(e.x,e.y,'#c4b5fd',16);break}}}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.life-=dt*1.5}particles=particles.filter(p=>p.life>0)}
function draw(){ctx.fillStyle='#020617';ctx.fillRect(0,0,w,h);const glow=ctx.createRadialGradient(w*.5,h*.85,0,w*.5,h*.85,w*.7);glow.addColorStop(0,'#172554');glow.addColorStop(1,'#020617');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);ctx.fillStyle='#fff';for(const s of stars){ctx.globalAlpha=.35+s.s*.25;ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.globalAlpha=1;if(running){ctx.save();ctx.translate(ship.x,ship.y);ctx.shadowBlur=25;ctx.shadowColor='#67e8f9';ctx.fillStyle='#67e8f9';ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(18,18);ctx.lineTo(0,10);ctx.lineTo(-18,18);ctx.closePath();ctx.fill();ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();ctx.restore()}for(const b of bullets){ctx.shadowBlur=15;ctx.shadowColor='#67e8f9';ctx.fillStyle='#a5f3fc';ctx.fillRect(b.x-2,b.y-9,4,18)}ctx.shadowBlur=0;for(const e of enemies){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.angle);ctx.strokeStyle='#f472b6';ctx.lineWidth=3;ctx.shadowBlur=18;ctx.shadowColor='#f472b6';ctx.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?e.r*.62:e.r,x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(p.life,0);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1}
function loop(t){const dt=Math.min((t-last)/1000,.035)||0;last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
